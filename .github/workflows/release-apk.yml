name: Build APK

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Assemble signed release
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform 34
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK" >&2
            ls -la "$SDK" || true
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Point Gradle at CI SDK
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > ZIGate/local.properties
          cat ZIGate/local.properties

      - name: Build signed release APK
        working-directory: ZIGate
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"

      - name: Package versioned APK
        id: apk
        run: |
          VNAME=$(grep 'versionName' ZIGate/app/build.gradle | head -1 | cut -d'"' -f2)
          SRC="ZIGate/app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC"
          mkdir -p ZIGate/output
          OUT="ZIGate/output/ZI-Gate-v${VNAME}-release.apk"
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "name=ZI-Gate-v${VNAME}-release.apk" >> "$GITHUB_OUTPUT"
          echo "version=$VNAME" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"
          sha256sum "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release (in-app updater)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.path }}"
          VER="${{ steps.apk.outputs.version }}"
          REPO="${{ github.repository }}"
          TAG="v${VER}"
          NOTES="ZI Gate ${VER}. Установите APK; приложение само предложит следующие версии."
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber -R "$REPO"
            gh release edit "$TAG" --latest -R "$REPO" || true
          else
            gh release create "$TAG" "$APK" --title "ZI Gate v${VER}" --notes "$NOTES" --latest -R "$REPO"
          fi
